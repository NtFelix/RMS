# Dependabot configuration for automatic dependency updates
# Documentation: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Enable version updates for npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Berlin"
    versioning-strategy: increase
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group patch updates, plus group related ecosystem packages together for minor updates
    # Unmatched minor updates will receive individual PRs
    groups:
      posthog-ecosystem:
        patterns:
          - "posthog*"
          - "@posthog/*"
      nextjs-ecosystem:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
      radix-ui:
        patterns:
          - "@radix-ui/*"
      tiptap:
        patterns:
          - "@tiptap/*"
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
      production-patch-updates:
        dependency-type: "production"
        update-types:
          - "patch"
      development-patch-updates:
        dependency-type: "development"
        update-types:
          - "patch"

  # Enable version updates for Docker images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"
      include: "scope"
